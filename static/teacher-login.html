<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher sign in · Listening room</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#23392e;font:16px system-ui,sans-serif}main{max-width:460px;margin:80px auto;padding:24px}h1{font-size:36px;letter-spacing:-.04em}form{background:white;padding:28px;border:1px solid #dde3dc;border-radius:16px}label{display:block;margin-bottom:10px;font-weight:600}input{width:100%;padding:12px;border:1px solid #bac7bd;border-radius:8px;font:inherit;margin-bottom:20px}button{border:0;border-radius:8px;padding:12px 18px;background:#264f3c;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.5}a{color:#264f3c}:focus-visible{outline:3px solid #b38b44;outline-offset:3px}#status{color:#94502d;min-height:24px}
</style>
<main>
<h1>Teacher sign in</h1>
<form id="login">
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
<button type="submit">Sign in</button>
<p id="status" role="status" aria-live="polite"></p>
</form>
<p><a href="/listening">Back to listening room</a></p>
</main>
<script>
document.querySelector('#login').addEventListener('submit', async event => {
  event.preventDefault();
  const button = event.target.querySelector('button');
  const status = document.querySelector('#status');
  button.disabled = true;
  status.textContent = '';
  try {
    const response = await fetch('/api/teacher/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({password: document.querySelector('#password').value})});
    if (!response.ok) throw new Error(response.status === 401 ? 'Incorrect password. Try again.' : 'Could not sign in. Try again.');
    location.replace('/teacher');
  } catch (error) { status.textContent = error.message; }
  finally { button.disabled = false; }
});
</script>
</html>
